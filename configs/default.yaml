seeds:
  map_seed: 42
  dynamics_seed: 43

world:
  size_m: 4000.0
  airship_xy_m: [2000.0, 2000.0]

sensors:
  count: 150
  distribution: radial_clusters
  scatter_mode: independent
  inner_scatter_count: 6
  outer_scatter_count: 3
  position_overrides_by_seed:
    42:
      42:
      - 3300.0
      - 3600.0
      106:
      - 3700.0
      - 3200.0
  partition_radius_m: 1800.0
  inner_count: 100
  inner_cluster_count: 5
  inner_center_radius_range_m: [650.0, 1450.0]
  outer_center_radius_range_m: [2100.0, 2250.0]
  outer_radius_range_m: [2000.0, 2400.0]
  local_scatter_radius_m: 300.0
  arrival_rate_per_sec: 0.5
  cold_start_sec: 60.0
  cluster_count: 7
  cluster_ratio: 0.90
  cluster_std_m: 100.0
  cluster_center_margin_m: 300.0
  min_cluster_center_distance_m: 400.0

uavs:
  count: 6
  initial_battery_frac: 1.0
  initial_serving_ids: [0, 1, 2, 3, 4, 5]
  speed_mps: 6.0
  max_move_time_sec: 30.0
  coverage_radius_m: 173.2  # 100 m altitude * tan(60 deg from vertical)
  return_reserve_frac: 0.0

time:
  low_step_sec: 60.0
  low_steps_per_frame: 10
  episode_upper_frames: 100

energy:
  battery_capacity_wh: 125.0
  horizontal_power_w: 257.0
  hover_power_w: 326.0
  climb_power_w: 400.0
  charging_power_w: 500.0
  horizontal_speed_mps: 6.0
  climb_speed_mps: 5.0
  service_to_airship_height_m: 50.0  # Airship 150 m AGL minus service altitude 100 m AGL

zones:
  charging_slots: 2
  waiting_slots: 2
  release_battery_frac: 0.999
  allocation_rule: lowest_arrival_battery

service:
  mode: full_clear_nearest

reward:
  low_covered_max_sum_weight: 0.05
  low_system_max_after_weight: 1.0
  low_oob_uav_weight: 10.0
  low_death_weight: 1000.0
  low_return_distance_weight: 1000.0
  low_return_distance_scale_m: 1800.0
  upper_serving_weight: 1.0
  upper_frame_max_backlog_weight: 1.0  # Maximum bounded backlog cost
  upper_backlog_mode: bounded
  upper_backlog_reference_frames: 10.0  # 0.5 packets/s * 600 s/frame * 10 = 3000 packets
  upper_episode_failure_weight: 1000.0  # Used only when no upper death penalty applies
  upper_dead_weight: 1000.0

metrics:
  coverage_grid_size: 64
