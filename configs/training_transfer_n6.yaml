# Six-UAV Paper1 actor warm start; --upper-pretrained is mandatory for fresh runs.
require_upper_pretrained: true
transfer_fleet: 6
# Upper rollout steps are environment frames, accumulated across episode resets.
seed: 43
# 350 complete MAPPO rollouts.
total_upper_steps: 358400
console_log_mode: mappo_update
upper_reward_overrides:
  upper_reward_mode: paper1_serving_backlog
  upper_serving_weight: 5.0
  upper_charging_weight: 0.0
  upper_waiting_weight: 0.0
  upper_dead_weight: 10.0
  upper_frame_max_backlog_weight: 0.5
  upper_backlog_scale_packets: 800.0
  upper_backlog_mode: linear
  upper_backlog_cap: 1.5  # cap on 0.5 * B / 800, equivalent to B <= 2400
  upper_lower_return_failure_weight: 0.0
  upper_episode_failure_weight: 0.0
  upper_reward_divisor: 10.0
train_log_every_frames: 10  # Also log every episode end and MAPPO update
plot_every_frames: 100
diagnostics_every_low_steps: 100  # Distribution probe only; 0 disables it
upper_rollout_steps: 1024
sac_updates_per_step: 1  # Constant throughout training
checkpoint_every_mappo: 1
evaluate_every_mappo: 1
evaluation_seeds: [1001, 1002, 1003]
normalization:
  clip: 10.0
  min_std_sec: 60.0
sac:
  include_uav_id: true
  hidden: 128
  heads: 4
  layers: 2
  lr: 0.0003
  gamma: 0.99
  tau: 0.005
  alpha: 0.05
  auto_alpha: true
  batch_size: 256
  replay_capacity: 100000
  random_steps: 10000
  warmup_mode: waypoint
  warmup_random_fraction: 0.2
  warmup_energy_guard: true
  warmup_return_reserve_frac: 0.02  # Extra SOC margin for guided actions only
  learning_starts: 10000
  reward_scale: 1.0
  max_grad_norm: 1.0
mappo:
  actor_architecture: paper1_notebook
  transfer_actor_hidden: 512  # Checked against the source checkpoint
  observation_mode: arrival_soc
  paper1_ppo: true
  hidden: 512
  actor_lr: 0.0001
  critic_lr: 0.0001
  gamma: 0.99
  gae_lambda: 0.95
  epochs: 4
  minibatch_frames: 128
  clip: 0.2
  value_clip: null  # Disable value clipping for the revised reward scale
  entropy_coef: 0.01  # Constant throughout training; no entropy decay
  reward_scale: 1.0
  max_grad_norm: 1.0
  max_grad_norm_actor: 0.5
  max_grad_norm_critic: 2.0
  value_coef: 0.5
