# Upper rollout steps are environment frames, accumulated across episode resets.
seed: 123
# Equivalent to 4000 full-length episodes of 100 frames.
total_upper_steps: 400000
log_every_frames: 50
train_log_every_frames: 10  # Also log every episode end and MAPPO update
plot_every_frames: 100
diagnostics_every_low_steps: 100  # Distribution probe only; 0 disables it
upper_rollout_steps: 512
sac_updates_per_step: 1  # Constant throughout training
checkpoint_every_mappo: 2
evaluate_every_mappo: 2
evaluation_seeds: [1001, 1002, 1003]
normalization:
  clip: 10.0
  min_std_sec: 60.0
sac:
  include_uav_id: true
  hidden: 128
  heads: 4
  layers: 2
  lr: 0.0003
  gamma: 0.99
  tau: 0.005
  alpha: 0.05
  auto_alpha: true
  batch_size: 256
  replay_capacity: 100000
  random_steps: 10000
  warmup_mode: waypoint
  warmup_random_fraction: 0.2
  warmup_energy_guard: true
  warmup_return_reserve_frac: 0.02  # Extra SOC margin for guided actions only
  learning_starts: 10000
  reward_scale: 1.0
  max_grad_norm: 1.0
mappo:
  observation_mode: arrival_soc
  hidden: 128
  actor_lr: 0.0001
  critic_lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  epochs: 3
  minibatch_frames: 128
  clip: 0.2
  value_clip: null  # Disable value clipping for the revised reward scale
  entropy_coef: 0.05  # Constant throughout training; no entropy decay
  reward_scale: 1.0
  max_grad_norm: 1.0
